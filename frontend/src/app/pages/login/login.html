<section>
    <h2>Iniciar sesión</h2>

    <form [formGroup]="formulario" (ngSubmit)="login()">
        <div>
            <label for="username">Usuario</label>
            <input type="text" id="username" formControlName="username">

            @if (formulario.controls.username.hasError('required') && formulario.controls.username.touched) {
                <small class="error">Campo requerido</small>
            }
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input type="text" id="password" formControlName="password">

            @if (formulario.controls.password.hasError('required') && formulario.controls.password.touched) {
                <small class="error">Campo requerido</small>
            }
        </div>

        @if(error()){
            <p class="error"> {{error()}}</p>
        }

        <button type="submit" [disabled]="formulario.invalid || cargando()">
            {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
        </button>

    </form>

</section>
