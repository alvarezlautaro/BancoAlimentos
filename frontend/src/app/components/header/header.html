<div class="site-header">
    <a class="brand" routerLink="/home">Banco de Alimentos</a>
    @if (auth.isLoggedIn()) {
        <div class="session">
            <a routerLink="/home">Inicio</a>
            <span>Usuario: {{ auth.username() }}</span>
            <button type="button" (click)="auth.logout()">Cerrar sesión</button>
        </div>
    }
</div>
