<h2>Crear Remito</h2>

<form [formGroup]="formulario">

    <div>
        <label for="">Fecha:</label>
        <input type="date" formControlName="fecha">

        @if (formulario.controls.fecha.hasError('required') && formulario.controls.fecha.touched) {
            <small style="color: red">Campo requerido</small>
        }
    </div>

    <div>
        <label for="">Institución:</label>

        <select id="idInstitucion" formControlName="idInstitucion">
            <option value="0" disabled selected>
                Seleccione una institución...
            </option>

            @for (institucion of instituciones; track $index) {
                <option [value]="institucion.id">
                    {{ institucion.nombre }}
                </option>
            }
        </select>

        @if (formulario.controls.idInstitucion.hasError('min') && formulario.controls.idInstitucion.touched) {
            <small style="color: red">
                Debe seleccionar una institución
            </small>
        }
    </div>

    <div>
        <button (click)="add()" [disabled]="formulario.invalid">
            Crear Remito
        </button>
    </div>

</form>
