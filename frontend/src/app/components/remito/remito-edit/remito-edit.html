<section>

    <h2>Editar remito</h2>

    <form [formGroup]="formulario">

        <div>
            <label for="">Fecha</label>
            <input type="date" formControlName="fecha">
        </div>

        <div>
            <label for="">Institución</label>
            <input type="number" formControlName="idInstitucion">
        </div>

        <div>

            <button (click)="save()" [disabled]="formulario.invalid">
                Guardar cambios
            </button>

            <button (click)="cancel()">
                Cancelar
            </button>

        </div>

    </form>

</section>
