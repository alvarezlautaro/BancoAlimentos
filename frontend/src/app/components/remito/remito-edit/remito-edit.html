<section>

    <h2>Editar remito</h2>

    <form [formGroup]="formulario">

        <div>
            <label for="">Fecha</label>
            <input type="date" formControlName="fecha">
        </div>

        <div>
            <label for="">Institución</label>
            <select formControlName="idInstitucion">
                <option [ngValue]="0" disabled>Seleccione una institución...</option>
                @for (institucion of instituciones; track institucion.id) {
                    <option [ngValue]="idValue(institucion.id)">{{ institucion.nombre }}</option>
                }
            </select>
        </div>

        <div>

            <button (click)="save()" [disabled]="formulario.invalid">
                Guardar cambios
            </button>

            <button (click)="cancel()">
                Cancelar
            </button>

        </div>

    </form>

</section>
