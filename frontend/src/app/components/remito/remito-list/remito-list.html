<section>

    <h1>Listado de remitos</h1>

    <ul>
        @for (item of remitoService.remitos(); track $index) {
            <li>
                Remito:
                {{ item.fecha }}
                - Institución:
                {{ item.idInstitucion }}

                <button (click)="editar(item)">Editar</button>
                <button (click)="eliminar(item.externalId)">Eliminar</button>
            </li>
        }
    </ul>

    @if (remitoService.remitoByID(); as r) {
        <app-remito-edit></app-remito-edit>
    }

    @if (remitoService.error(); as mensajeError) {
        <div style="color: red; border: 1px solid red; padding: 10px; margin-top: 10px;">
            {{ mensajeError }}
        </div>
    }

</section>
